[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "object-detection-core"
version = "0.1.0"
description = "Core object detection + distance calculation logic"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Beauty" }]
license = { text = "MIT" }

dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "torch>=2.0; platform_system != 'Windows' or platform_machine != 'ARM64'",
  "ultralytics>=8.0.0",
  "pydantic>=2.0",
  "loguru>=0.7"
]

[project.optional-dependencies]

dev = ["pytest", "ruff", "mypy", "build", "twine"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["object_detection_app*"]

[tool.setuptools.package-data]
"object_detection_app" = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.txt"]